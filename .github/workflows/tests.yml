# Based on the tests.yml that `brew tap-new` generates (Homebrew 7.0.12).
# Builds bottles on every PR and keeps them as workflow artifacts only;
# publish.yml uploads them once, when the PR is ready to merge.
name: brew test-bot

on:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux only: these formulas' bottles are identical on every platform,
        # and two builds are enough for `brew bottle --merge` to write `all:`.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # --only-json-tab keeps the install receipt out of the tarball, which
      # makes the builds byte-identical across platforms, so the merge in
      # publish.yml writes an `all:` bottle.
      - run: brew test-bot --only-formulae --only-json-tab --root-url=https://ghcr.io/v2/afrossard/scratch

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

